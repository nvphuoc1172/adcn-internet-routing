!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 ip address 200.200.74.1 255.255.255.240
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 100.100.74.1 255.255.255.252
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 110.110.74.1 255.255.255.252
 clock rate 2000000
!
router ospf 1
 log-adjacency-changes
 network 100.100.74.0 0.0.0.3 area 0
 network 110.110.74.0 0.0.0.3 area 0
 network 200.200.74.0 0.0.0.15 area 0
!
router bgp 100
 no synchronization
 bgp log-neighbor-changes
 network 200.200.74.0 mask 255.255.255.240
 neighbor 100.100.74.2 remote-as 100
 neighbor 110.110.74.2 remote-as 100
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
