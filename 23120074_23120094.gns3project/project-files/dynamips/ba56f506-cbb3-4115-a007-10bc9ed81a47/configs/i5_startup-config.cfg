!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R5
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
interface FastEthernet0/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/0
 ip address 120.120.74.2 255.255.255.252
 clock rate 2000000
!
interface FastEthernet0/1
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Serial0/1
 ip address 130.130.74.1 255.255.255.252
 clock rate 2000000
!
router ospf 1
 log-adjacency-changes
 redistribute rip subnets
 network 120.120.74.0 0.0.0.3 area 0
!
router rip
 version 2
 redistribute bgp 300 metric 1
 redistribute ospf 1 metric 1
 network 130.130.0.0
 no auto-summary
!
router bgp 300
 no synchronization
 bgp log-neighbor-changes
 network 120.120.74.0 mask 255.255.255.252
 network 130.130.74.0 mask 255.255.255.252
 network 210.210.74.0 mask 255.255.255.240
 neighbor 120.120.74.1 remote-as 100
 neighbor 130.130.74.2 remote-as 300
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
